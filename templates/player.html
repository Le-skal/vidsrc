<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Player" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='player.css') }}" rel="stylesheet">
</head>

<body>
    <div class="netflix-player">
        <!-- Player Container -->
        <div class="player-container" id="playerContainer">
            <iframe id="playerFrame" class="player-iframe" src="{{ iframe_url }}" allowfullscreen
                allow="autoplay; fullscreen; picture-in-picture"></iframe>

            <!-- Transparent overlay to capture mouse events over iframe (top area only) -->
            <div id="mouseEventCapture" style="position: absolute; top: 0; left: 0; width: 100%; height: 25%; z-index: 5; pointer-events: auto;"></div>

            <!-- Top Overlay (Title & Info) -->
            <div class="player-overlay player-overlay-top" id="overlayTop">
                <div class="overlay-gradient-top"></div>
                <div class="overlay-content">
                    <a href="/" class="btn-back">← Back</a>
                    <div class="title-info">
                        <h1>{{ title }}</h1>
                        {% if media_type == "tv" %}
                        <div class="episode-info">Season {{ season or 1 }} • Episode {{ episode or 1 }}</div>
                        {% endif %}
                    </div>
                </div>
            </div>

            <!-- Bottom Controls (like Netflix) -->
            <div class="player-overlay player-overlay-bottom" id="overlayBottom">
                <div class="overlay-gradient-bottom"></div>
                <div class="controls-bar">
                    <div class="controls-content">
                        <div class="controls-left">
                        </div>

                        <div class="controls-middle" id="tvControls" style="display: none;">
                            <div class="tv-control-group">
                                <label>Season</label>
                                <input id="seasonInput" type="number" min="1" value="{{ season or 1 }}" />
                            </div>
                            <div class="tv-control-group">
                                <label>Episode</label>
                                <input id="episodeInput" type="number" min="1" value="{{ episode or 1 }}" />
                            </div>
                            <button id="loadBtn" class="control-btn">Load</button>
                            <button id="nextEpisodeBtn" class="control-btn">Next Ep</button>
                            <button id="nextSeasonBtn" class="control-btn">Next Season</button>
                        </div>

                        <div class="controls-right">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const mediaType = "{{ media_type }}";
        const mediaId = "{{ id }}";

        const playerContainer = document.getElementById("playerContainer");
        const overlayTop = document.getElementById("overlayTop");
        const overlayBottom = document.getElementById("overlayBottom");
        const tvControls = document.getElementById("tvControls");
        const seasonInput = document.getElementById("seasonInput");
        const episodeInput = document.getElementById("episodeInput");
        const loadBtn = document.getElementById("loadBtn");
        const nextEpisodeBtn = document.getElementById("nextEpisodeBtn");
        const nextSeasonBtn = document.getElementById("nextSeasonBtn");
        const playerFrame = document.getElementById("playerFrame");
        const mouseEventCapture = document.getElementById("mouseEventCapture");

        // Show/hide controls on hover with auto-hide
        let hideTimeout;
        
        const showControls = () => {
            clearTimeout(hideTimeout);
            overlayTop.classList.add("show");
            overlayBottom.classList.add("show");
            document.body.style.cursor = "auto";
            
            hideTimeout = setTimeout(() => {
                overlayTop.classList.remove("show");
                overlayBottom.classList.remove("show");
                document.body.style.cursor = "none";
            }, 3000);
        };

        // Listen on document body to catch all mouse movements (including over iframe)
        document.addEventListener("mousemove", showControls);
        
        // Listen on the transparent overlay to catch mouse movements over iframe
        mouseEventCapture.addEventListener("mousemove", showControls);

        playerContainer.addEventListener("mouseleave", () => {
            clearTimeout(hideTimeout);
            overlayTop.classList.remove("show");
            overlayBottom.classList.remove("show");
            document.body.style.cursor = "auto";
        });

        if (mediaType === "tv" || mediaType === "series") {
            tvControls.style.display = "flex";
        }

        function vidsrcTvUrl(id, season, episode) {
            if (!season) return `https://vidsrc.icu/embed/tv/${id}`;
            if (!episode) return `https://vidsrc.icu/embed/tv/${id}/${season}`;
            return `https://vidsrc.icu/embed/tv/${id}/${season}/${episode}`;
        }

        function updateIframeForTv() {
            const s = parseInt(seasonInput.value) || 1;
            const e = parseInt(episodeInput.value) || 1;
            playerFrame.src = vidsrcTvUrl(mediaId, s, e);
        }

        function saveProgress(s, e) {
            fetch("/api/update_progress", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    id: mediaId,
                    type: mediaType,
                    season: s,
                    episode: e,
                    title: "{{ title }}"
                })
            });
        }

        loadBtn?.addEventListener("click", () => {
            const s = parseInt(seasonInput.value) || 1;
            const e = parseInt(episodeInput.value) || 1;
            updateIframeForTv();
            saveProgress(s, e);
        });

        nextEpisodeBtn?.addEventListener("click", () => {
            let s = parseInt(seasonInput.value) || 1;
            let e = parseInt(episodeInput.value) || 1;
            e++;
            seasonInput.value = s;
            episodeInput.value = e;
            updateIframeForTv();
            saveProgress(s, e);
        });

        nextSeasonBtn?.addEventListener("click", () => {
            let s = parseInt(seasonInput.value) || 1;
            s++;
            seasonInput.value = s;
            episodeInput.value = 1;
            updateIframeForTv();
            saveProgress(s, 1);
        });
    </script>
</body>

</html>
