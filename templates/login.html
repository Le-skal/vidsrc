<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Account</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
<main class="container">
  <h2>🎬 Select an Account</h2>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <div class="accounts">
    {% for acc in accounts %}
      <form method="POST">
        <input type="hidden" name="account" value="{{ acc }}">
        <button class="account-btn" type="submit">
          <div class="account-avatar">
            {{ acc[0]|upper }}
          </div>
          {{ acc }}
        </button>
      </form>
    {% endfor %}
  </div>

  <div class="new-account">
    <form method="POST">
      <input type="text" name="account" placeholder="Create new account" required>
      <button type="submit" class="btn-primary">Add</button>
    </form>
  </div>
</main>
</body>
</html>
