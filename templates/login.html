<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Account</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
<main class="login-container">
  <h2>🎬 Select an Account</h2>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <div class="accounts">
    {% for acc in accounts %}
      <form method="POST" class="account-form">
        <input type="hidden" name="account" value="{{ acc }}">
        <button class="account-btn" type="submit">
          {% if account_avatars.get(acc) %}
            <img src="{{ account_avatars.get(acc) }}" alt="{{ acc }}" class="account-avatar-img">
          {% else %}
            <div class="account-avatar">?</div>
          {% endif %}
          <span class="account-name">{{ acc }}</span>
        </button>
      </form>
    {% endfor %}
  </div>

  <div class="new-account">
    <form method="POST">
      <input type="text" name="account" placeholder="Create new account" required>
      <button type="submit" class="btn-primary">Add</button>
    </form>
  </div>
</main>
</body>
</html>
